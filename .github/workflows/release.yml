name: Release (Windows installer)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de phat hanh, vi du v1.1.0. Bo trong thi chi build lay file, khong tao Release.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build NSIS + MSI
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Workflow chay duoc theo hai duong: push tag, hoac chay tay co dien tag.
      # Gop lai mot cho de cac buoc sau khong phai biet no den tu dau.
      - name: Xac dinh tag phat hanh
        id: rel
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "${{ github.event.inputs.tag }}".Trim()
          }
          if ($tag -and $tag -notmatch '^v\d+\.\d+\.\d+') {
            Write-Host "::error::Tag phai co dang vX.Y.Z, nhan duoc: $tag"
            exit 1
          }
          $publish = if ($tag) { 'true' } else { 'false' }
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($publish -eq 'true') {
            Write-Host "Se phat hanh Release voi tag $tag"
          } else {
            Write-Host "Khong dien tag — chi build lay file, khong tao Release"
          }

      # Tag v1.2.3 ma package.json van ghi 1.0.0 thi installer se ra ten sai.
      # Bat loi ngay tu dau thay vi build 15 phut roi moi phat hien.
      - name: Kiem tra phien ban tag khop ma nguon
        if: steps.rel.outputs.publish == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.rel.outputs.tag }}" -replace '^v', ''
          $pkg  = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $m = Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1
          if (-not $m) { Write-Host "::error::Khong doc duoc version trong src-tauri/Cargo.toml"; exit 1 }
          $cargo = $m.Matches[0].Groups[1].Value
          $bad = @()
          if ($pkg   -ne $version) { $bad += "package.json = $pkg" }
          if ($conf  -ne $version) { $bad += "tauri.conf.json = $conf" }
          if ($cargo -ne $version) { $bad += "Cargo.toml = $cargo" }
          if ($bad.Count -gt 0) {
            Write-Host "::error::Tag la $version nhung $($bad -join ', '). Sua cho khop roi tag lai."
            exit 1
          }
          Write-Host "Phien ban khop: $version"

      - name: Xac dinh thong tin ban phat hanh
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Tag co dau gach ngang (v1.1.0-beta.1) duoc coi la ban thu nghiem.
          $prerelease = if ("${{ steps.rel.outputs.tag }}" -match '-') { 'true' } else { 'false' }
          "version=$version"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cai dependencies
        run: npm ci

      - name: Dong goi file cai dat
        run: npm run tauri:build

      # Installer khong duoc ky so, nen dua ra ma bam de nguoi tai tu doi chieu.
      - name: Tinh ma bam SHA-256
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path `
            src-tauri/target/release/bundle/nsis/*.exe, `
            src-tauri/target/release/bundle/msi/*.msi
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Luu installer lam artifact
        uses: actions/upload-artifact@v4
        with:
          name: passmail-${{ steps.meta.outputs.version }}-windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt

      # Khi chay tay, tag chua ton tai — action tu tao no qua API bang GITHUB_TOKEN
      # (job da co permissions: contents: write), nen khong can push tag tu git.
      - name: Dinh kem vao GitHub Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PassMail ${{ steps.meta.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            SHA256SUMS.txt
